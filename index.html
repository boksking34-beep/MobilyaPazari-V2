<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobilya Pazarı</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#17392f;font:16px system-ui}header{background:#123e32;color:white;padding:30px 20px}header small{color:#d5e8db}h1{margin:8px 0;font-size:32px}main{max-width:1000px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;border:1px solid #d5ddd6;border-radius:12px;padding:12px;width:100%;margin:4px 0}button,a{background:#176b4b;color:white;border:0;text-decoration:none;cursor:pointer}a{display:block;text-align:center;padding:12px;border-radius:10px}article,form,.filters{background:white;border-radius:18px;padding:16px;box-shadow:0 3px 16px #123e3210;margin-bottom:14px}img{width:100%;height:210px;object-fit:cover;border-radius:12px}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}h3{margin:10px 0}strong{font-size:24px}p{overflow-wrap:anywhere}small{color:#64756b}.line{display:flex;gap:8px;align-items:center}.line>*{flex:1}.fav{background:#edf3ed;color:#176b4b}.tag{font-size:13px;color:#176b4b}#status{padding:8px 0}button:disabled{opacity:.5}[hidden]{display:none!important}</style><header><small> MOBİLYA • ALIŞVERİŞ • TÜRKİYE </small><h1>Mobilya Pazarı</h1>Evine yakışanı bul.</header><main><div class="line"><button id="add">+ Ücretsiz ilan ver</button><button id="only" class="fav">♡ Favoriler</button></div><div id="status" role="status"></div><form hidden><h2>Yeni ilan</h2><input name="title" placeholder="Ürün adı" required maxlength="100"><input name="price" type="number" min="1" placeholder="Fiyat (TL)" required><input name="city" placeholder="Şehir" required><select name="product" class="products"></select><select name="category"><option>Sıfır</option><option>İkinci el</option></select><textarea name="description" placeholder="Ürün açıklaması"></textarea><input name="phone" type="tel" placeholder="05xx xxx xx xx" required><small>Telefon numaranız WhatsApp bağlantısında paylaşılır.</small><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"><button>İlanı yayınla</button></form><section class="filters"><input id="search" placeholder="Ürün veya şehir ara"><div class="line"><select id="product" class="products"></select><select id="filter"><option value="">Tüm durumlar</option><option>Sıfır</option><option>İkinci el</option></select></div><div class="line"><input id="max" type="number" min="0" placeholder="En yüksek fiyat"><select id="sort"><option value="new">En yeni</option><option value="low">En ucuz</option><option value="high">En pahalı</option></select></div></section><p id="count"></p><div id="list"></div></main><script>
const $=s=>document.querySelector(s);let ads=[],only=false,favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('mobilya-favs')||'[]'))}catch{};const cats=['Koltuk','Köşe koltuk','Yatak odası','Yemek odası','Masa ve sandalye','TV ünitesi','Diğer'];document.querySelectorAll('.products').forEach(s=>{if(s.id)s.add(new Option('Tüm kategoriler',''));cats.forEach(c=>s.add(new Option(c,c)))});const status=t=>$('#status').textContent=t;const form=$('form');$('#add').onclick=()=>{form.hidden=!form.hidden};$('#only').onclick=()=>{only=!only;$('#only').textContent=only?'♥ Favoriler açık':'♡ Favoriler';draw()};function draw(){let list=$('#list');list.replaceChildren();let rows=ads.filter(a=>{let cat=a.product||(a.title.toLocaleLowerCase('tr').includes('koltuk')?'Koltuk':'Diğer');return (!only||favs.has(a.id))&&(!$('#product').value||cat===$('#product').value)&&(!$('#filter').value||a.category===$('#filter').value)&&(!$('#max').value||a.price<=+$('#max').value)&&(a.title+' '+a.city+' '+a.description).toLocaleLowerCase('tr').includes($('#search').value.toLocaleLowerCase('tr'))});if($('#sort').value!=='new')rows.sort((a,b)=>$('#sort').value==='low'?a.price-b.price:b.price-a.price);$('#count').textContent=rows.length+' ilan bulundu';for(let a of rows){let c=document.createElement('article');if(a.image){let i=document.createElement('img');i.src=a.image;i.loading='lazy';i.alt=a.title;c.append(i)}for(let [tag,t] of [['h3',a.title],['strong',a.price.toLocaleString('tr-TR')+' TL'],['p',a.city+' · '+a.category],['p',a.description]]){let e=document.createElement(tag);e.textContent=t;c.append(e)}let f=document.createElement('button');f.className='fav';f.textContent=favs.has(a.id)?'♥ Favorilerden çıkar':'♡ Favoriye ekle';f.onclick=()=>{favs.has(a.id)?favs.delete(a.id):favs.add(a.id);try{localStorage.setItem('mobilya-favs',JSON.stringify([...favs]))}catch{}draw()};c.append(f);let l=document.createElement('a');l.href='https://wa.me/'+a.phone+'?text='+encodeURIComponent('Merhaba, Mobilya Pazarı üzerindeki '+a.title+' ilanınız hakkında bilgi almak istiyorum.');l.textContent='WhatsApp ile ulaş';c.append(l);list.append(c)}if(!rows.length)list.textContent='Henüz uygun ilan yok.'}async function load(){let r=await fetch('/api',{cache:'no-store'});if(!r.ok)throw Error('İlanlar yüklenemedi.');ads=await r.json();draw()}for(let s of ['#search','#filter','#max','#product','#sort'])$(s).oninput=draw;form.onsubmit=async e=>{e.preventDefault();let btn=form.querySelector('button');btn.disabled=true;status('İlan kaydediliyor…');try{let d=Object.fromEntries(new FormData(form)),f=d.photo;delete d.photo;if(f.size>2500000)throw Error('Fotoğraf en fazla 2,5 MB olabilir.');d.image=f.size?await new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)}):'';let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),out=await r.json();if(!r.ok)throw Error(out.error);form.reset();form.hidden=true;$('#search').value=$('#filter').value=$('#max').value=$('#product').value='';only=false;$('#only').textContent='♡ Favoriler';status(out.duplicate?'Bu ilan zaten mevcut.':'İlan başarıyla yayınlandı.');await load()}catch(e){status(e.message||'Bağlantı hatası.')}finally{btn.disabled=false}};load().catch(e=>status(e.message));</script></html>
